[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "axiompy-data"
version = "3.0.0"
description = "Big-data and data-engineering utilities for AxiomPy (streaming, Arrow, pipelines)"
readme = "README.md"
license = "MIT"
authors = ["Jorge Varona <varonusmaximus@users.noreply.github.com>"]
keywords = ["data", "pandas", "pyspark", "streaming", "arrow", "axiompy"]
packages = [{ include = "axiompy" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
axiompy = ">=2.0.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
ruff = "0.14.14"
pre-commit = ">=3.5.0"
bandit = ">=1.8.6"
pip-audit = ">=2.6.0"
mypy = ">=1.4.0"

[project]
name = "axiompy-data"
version = "3.0.0"
description = "Big-data and data-engineering utilities for AxiomPy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jorge Varona", email = "varonusmaximus@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["axiompy>=2.0.0,<3.0.0"]

[project.urls]
Repository = "https://github.com/varonusmaximus/axiompy-data"
Documentation = "https://github.com/varonusmaximus/axiompy-data#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff==0.14.14",
    "pre-commit>=3.5.0",
    "bandit>=1.8.6",
    "pip-audit>=2.6.0",
    "mypy>=1.4.0",
]
data = ["pandas>=1.5.0"]
spark = ["pyspark>=3.3.0"]
compression = [
    "zstandard>=0.21.0",
    "lz4>=4.3.0",
    "python-snappy>=0.6.1",
]
polars = ["polars>=0.19.0"]
consuming-duckdb = ["duckdb>=0.9.0", "pyarrow>=12.0.0"]
consuming-snowflake = ["adbc-driver-snowflake>=0.8.0", "pyarrow>=12.0.0"]
consuming-postgres = ["adbc-driver-postgresql>=0.8.0", "pyarrow>=12.0.0"]
consuming-databricks = ["databricks-sql-connector>=3.0.0", "pyarrow>=12.0.0"]
consuming-all = [
    "duckdb>=0.9.0",
    "pyarrow>=12.0.0",
    "adbc-driver-snowflake>=0.8.0",
    "adbc-driver-postgresql>=0.8.0",
    "databricks-sql-connector>=3.0.0",
]
data-all = [
    "pandas>=1.5.0",
    "pyspark>=3.3.0",
    "zstandard>=0.21.0",
    "lz4>=4.3.0",
    "python-snappy>=0.6.1",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1.0",
    "duckdb>=0.9.0",
]
streaming-kafka = ["kafka-python>=2.0.0"]
streaming-kinesis = ["boto3>=1.26.0"]
streaming-redis = ["redis>=4.5.0"]
streaming-rabbitmq = ["pika>=1.3.0"]
streaming-all = [
    "kafka-python>=2.0.0",
    "boto3>=1.26.0",
    "redis>=4.5.0",
    "pika>=1.3.0",
]
otel = ["opentelemetry-api>=1.20.0"]
elastic = []
splunk = []
observability-all = ["opentelemetry-api>=1.20.0"]
test-all = [
    "pandas>=1.5.0",
    "pyspark>=3.3.0",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1.0",
    "zstandard>=0.21.0",
    "lz4>=4.3.0",
    "python-snappy>=0.6.1",
    "duckdb>=0.9.0",
    "adbc-driver-snowflake>=0.8.0",
    "adbc-driver-postgresql>=0.8.0",
    "boto3>=1.26.0",
    "moto>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "mysql-connector-python>=8.0.0",
    "google-cloud-storage>=2.10.0",
    "azure-storage-blob>=12.19.0",
    "kafka-python>=2.0.0",
    "redis>=4.5.0",
    "pika>=1.3.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["axiompy"]
omit = []

[tool.axiompy.skills]
destination = "project"

[tool.bandit]
skips = ["B608", "B314"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "ARG",
    "SIM",
]

ignore = [
    "E501",
    "F821",
    "ARG002",
    "ARG001",
    "ARG004",
    "B904",
    "N812",
    "SIM102",
    "ARG005",
    "F841",
    "UP035",
    "SIM117",
    "B027",
    "F401",
    "F822",
    "B023",
    "N818",
    "B008",
    "B011",
    "B017",
    "UP028",
    "B007",
    "W291",
    "SIM118",
    "UP006",
    "UP007",
    "UP045",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "I001", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_strict_optional = true
disable_error_code = [
    "abstract",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "exit-return",
    "index",
    "misc",
    "name-defined",
    "no-any-return",
    "operator",
    "override",
    "return",
    "return-value",
    "type-var",
    "union-attr",
    "valid-type",
    "var-annotated",
]
